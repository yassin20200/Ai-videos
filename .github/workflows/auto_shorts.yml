name: Auto AI Story Shorts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'نوع المحتوى (إسلامي سني / موعظة وحكمة / تفاعلي كرة قدم A أو B)'
        required: true
        default: 'islamic_story'
        type: choice
        options:
          - islamic_story
          - moral_wisdom
          - interactive_football
      custom_prompt:
        description: 'اكتب اسم القصة أو تفاصيلها (أو اتركه فارغاً ليختار قصة إسلامية صحيحة تلقائياً)'
        required: false
        default: ''
        type: string
      scenes_count:
        description: 'عدد المشاهد (12 مشهداً = أكثر من دقيقة لتحقيق الأرباح)'
        required: true
        default: '12'
        type: choice
        options:
          - '10'
          - '12'
          - '14'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Libraqm & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfreetype6-dev libfribidi-dev libharfbuzz-dev libraqm-dev fonts-hosny-amiri
          pip install --upgrade pip
          pip install requests "httpx[http2]" google-api-python-client google-auth google-auth-oauthlib edge-tts gradio_client huggingface_hub pillow arabic-reshaper python-bidi

      - name: Generate and Publish Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKENS: ${{ secrets.YT_REFRESH_TOKENS }}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
          IG_USER_IDS: ${{ secrets.IG_USER_IDS }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          CONTENT_TYPE: ${{ inputs.content_type }}
          CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
          SCENES_COUNT: ${{ inputs.scenes_count }}
        run: |
          python main.py
