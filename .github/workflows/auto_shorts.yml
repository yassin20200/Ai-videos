name: Auto AI Story Shorts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      episode_mode:
        description: 'نوع الإنتاج (دراما صينية عربية متعددة الأصوات)'
        required: true
        default: 'chinese_drama_ep1'
        type: choice
        options:
          - chinese_drama_ep1

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Arabic Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfreetype6-dev libfribidi-dev libharfbuzz-dev libraqm-dev fonts-hosny-amiri
          pip install --upgrade pip
          pip install requests "httpx[http2]" google-api-python-client google-auth google-auth-oauthlib edge-tts gradio_client huggingface_hub pillow arabic-reshaper python-bidi

      - name: Generate and Publish Drama Episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python main.py

      - name: Save Ready Video for Mobile Download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-episode-1-mp4
          path: "final_drama_ep1.mp4"
          retention-days: 5
