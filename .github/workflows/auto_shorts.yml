name: Auto AI Story Shorts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      teacher_voice:
        description: 'اختر صوت المدرس في الشرح العلمي'
        required: true
        default: 'ar-JO-TaimNeural'
        type: choice
        options:
          - ar-JO-TaimNeural
          - ar-EG-ShakirNeural
          - ar-SA-HamedNeural
      explainer_topic:
        description: 'موضوع الفيديو الهندسي (3D X-Ray Explainer)'
        required: true
        default: 'water_heater_15_scenes'
        type: choice
        options:
          - water_heater_15_scenes
          - custom_engineering_topic
      custom_prompt:
        description: 'اتركه فارغاً لفيديو السخان (أو اكتب اسم جهاز آخر لشرحه مستقبلاً)'
        required: false
        default: ''
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Libraqm & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfreetype6-dev libfribidi-dev libharfbuzz-dev libraqm-dev fonts-hosny-amiri
          pip install --upgrade pip
          pip install requests "httpx[http2]" google-api-python-client google-auth google-auth-oauthlib edge-tts gradio_client huggingface_hub pillow arabic-reshaper python-bidi

      - name: Generate and Publish Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKENS: ${{ secrets.YT_REFRESH_TOKENS }}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
          IG_USER_IDS: ${{ secrets.IG_USER_IDS }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TEACHER_VOICE: ${{ inputs.teacher_voice }}
          EXPLAINER_TOPIC: ${{ inputs.explainer_topic }}
          CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
        run: |
          python main.py
