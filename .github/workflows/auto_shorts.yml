name: Auto AI Story Shorts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      reciter_name:
        description: 'اختر صوت القارئ للتلاوة القرآنية'
        required: true
        default: 'Yasser_Ad-Dussary'
        type: choice
        options:
          - Yasser_Ad-Dussary
          - Maher_AlMuaiqly
          - Mishary_Alafasy
          - Nasser_AlQatami
          - AbdulBaset_Murattal
          - Minshawy_Murattal
      quran_story:
        description: 'اختر القصة القرآنية للمحاكاة البصرية'
        required: true
        default: 'musa_parting_sea'
        type: choice
        options:
          - musa_parting_sea
          - hijrah_cave_thawr
          - yunus_in_whale

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Libraqm & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfreetype6-dev libfribidi-dev libharfbuzz-dev libraqm-dev fonts-hosny-amiri
          pip install --upgrade pip
          pip install requests "httpx[http2]" google-api-python-client google-auth google-auth-oauthlib edge-tts gradio_client huggingface_hub pillow arabic-reshaper python-bidi

      - name: Generate and Publish Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKENS: ${{ secrets.YT_REFRESH_TOKENS }}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
          IG_USER_IDS: ${{ secrets.IG_USER_IDS }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          RECITER_NAME: ${{ inputs.reciter_name }}
          QURAN_STORY: ${{ inputs.quran_story }}
        run: |
          python main.py
