name: Auto AI Story Shorts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      english_voice:
        description: 'Select Realistic English Narrator Voice'
        required: true
        default: 'en-US-AndrewMultilingualNeural'
        type: choice
        options:
          - en-US-AndrewMultilingualNeural
          - en-US-BrianMultilingualNeural
          - en-US-ChristopherNeural
          - en-GB-RyanNeural
      custom_prompt:
        description: 'Topic or Custom Prompt (Optional)'
        required: false
        default: ''
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install requests "httpx[http2]" google-api-python-client google-auth google-auth-oauthlib edge-tts gradio_client huggingface_hub pillow

      - name: Generate and Publish Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKENS: ${{ secrets.YT_REFRESH_TOKENS }}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ENGLISH_VOICE: ${{ inputs.english_voice }}
          CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
        run: |
          python main.py
